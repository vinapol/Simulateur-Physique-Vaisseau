<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="orbit-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="spine-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond arrondi Space Dark -->
  <rect width="100" height="100" rx="22" fill="url(#space-bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Trajectoire orbitale elliptique brillante -->
  <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="url(#orbit-glow)" stroke-width="3.5" transform="rotate(-30 50 50)" filter="url(#glow)" stroke-dasharray="120 15" stroke-linecap="round" />
  
  <!-- Satellites sur l'orbite -->
  <circle cx="21" cy="33" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="79" cy="67" r="2.5" fill="#2dd4bf" filter="url(#glow)" />

  <!-- Vaisseau DSTV-80 (Spine centrale + Anneau centrifuge + Tuyère) -->
  <g transform="translate(50, 50) rotate(15)">
    <!-- Anneau centrifuge -->
    <ellipse cx="0" cy="-4" rx="14" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.85" />
    <!-- Poutre centrale -->
    <line x1="0" y1="-28" x2="0" y2="24" stroke="url(#spine-metal)" stroke-width="3" stroke-linecap="round" />
    <!-- Nez amarrage -->
    <circle cx="0" cy="-28" r="3.5" fill="#e2e8f0" />
    <!-- Panneaux / Radiateurs -->
    <line x1="-12" y1="12" x2="12" y2="12" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="18" x2="16" y2="18" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <!-- Moteur tuyère et plasma luminescent -->
    <path d="M -4 24 L 4 24 L 6 31 L -6 31 Z" fill="#475569" />
    <polygon points="0,38 -4,31 4,31" fill="#fbbf24" filter="url(#glow)" />
  </g>
</svg>